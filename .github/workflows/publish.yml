name: Publish release
on:
  push:
    branches: [release-upload]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the file and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "5aa020cce2cd2c35c854350debecee1526249eccaec4ecab1e3d060606f01e46  Retag.apk" | sha256sum -c -
          gh release create v1.1.1 Retag.apk --repo "$GITHUB_REPOSITORY" --target main --title "Retag 1.1.1" --notes-file notes.md --latest
