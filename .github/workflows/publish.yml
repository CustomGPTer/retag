name: Publish release
on:
  push:
    branches: [release-upload]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the file and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "db90f123d1cf213094164462d64c9a81576dd4de1e79ed0bae84aafa4246657c  Retag.apk" | sha256sum -c -
          gh release create v1.1 Retag.apk --repo "$GITHUB_REPOSITORY" --target main --title "Retag 1.1" --notes-file notes.md --latest
